<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex"
    >

    <meta
        name="theme-color"
        content="#080b14"
    >

    <title>404 — GamerXD_GZ's Server</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/logo.png"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .error-page {
            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 120px 0 60px;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    rgba(57,117,255,.10),
                    transparent 35%
                ),
                #080b14;

            color: #fff;

            text-align: center;
        }

        .error-content {
            width: min(
                700px,
                calc(100% - 30px)
            );
        }

        .error-logo {
            width: 76px;
            height: 76px;

            display: grid;
            place-items: center;

            margin: 0 auto 30px;

            border:
                1px solid rgba(255,255,255,.10);

            border-radius: 20px;

            background:
                rgba(255,255,255,.04);
        }

        .error-logo img {
            width: 52px;
            height: 52px;

            object-fit: contain;
        }

        .error-code {
            margin-bottom: 15px;

            color:
                rgba(255,255,255,.25);

            font-size:
                clamp(
                    5rem,
                    18vw,
                    10rem
                );

            line-height: .8;

            font-weight: 850;

            letter-spacing: -.09em;
        }

        .error-content h1 {
            margin-bottom: 15px;

            font-size:
                clamp(
                    2rem,
                    5vw,
                    3.5rem
                );

            line-height: 1;

            letter-spacing: -.05em;
        }

        .error-content p {
            max-width: 480px;

            margin: 0 auto;

            color:
                rgba(255,255,255,.48);

            font-size: 15px;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;

            gap: 10px;

            margin-top: 30px;
        }

        @media (max-width: 520px) {

            .error-actions {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <div
        id="loader"
        class="loader"
        aria-hidden="true"
    >

        <div class="loader-content">

            <div class="loader-logo">

                <img
                    src="assets/logo.png"
                    alt=""
                    width="72"
                    height="72"
                >

            </div>

            <div class="loader-name">
                GamerXD_GZ
            </div>

            <div class="loader-line">
                <span></span>
            </div>

        </div>

    </div>


    <main class="error-page">

        <div class="error-content">

            <div class="error-logo">

                <img
                    src="assets/logo.png"
                    alt="GamerXD_GZ logo"
                    width="52"
                    height="52"
                >

            </div>


            <div class="error-code">
                404
            </div>


            <h1>
                Page not found.
            </h1>


            <p>
                The page you're looking for doesn't
                exist or may have been moved.
            </p>


            <div class="error-actions">

                <a
                    href="index.html"
                    class="button button-primary"
                >
                    Back home
                    <span aria-hidden="true">←</span>
                </a>


                <a
                    href="https://discord.gg/4BHUKrzXRf"
                    class="button button-ghost"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Join Discord
                    <span aria-hidden="true">↗</span>
                </a>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
